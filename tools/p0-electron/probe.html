  body { font-family: "Microsoft YaHei", sans-serif; }
  /* Visible anchor: solid opaque block. If the window is truly transparent,
     only THIS rectangle (and the right-side text) should differ from the desktop. */
  #anchor {
    position: absolute; left: 20px; top: 20px; width: 220px; height: 72px;
    background: #ffffff; border-radius: 12px;
    box-sizing: border-box; padding: 12px 14px;
    color: #d02020; font-size: 19px; font-weight: 700; line-height: 1.35;
  }
  #ghost {
    position: absolute; left: 880px; top: 300px; width: 280px;
    color: #f7e1d7; font-size: 28px; font-weight: 700;
    text-shadow: 0 0 12px rgba(255,180,200,.9), 0 2px 2px rgba(0,0,0,.85);
  }
  /* Everything else stays fully transparent on purpose. */
</style>
</head>
<body>
  <div id="anchor">GLASS LYRICS P0<br>透明窗测试锚点</div>
  <div id="ghost">逐字歌词辉光测试</div>
