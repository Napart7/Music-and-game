<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassLyrics · 参照 DangoMusic 歌词渲染 v0.3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --glass: rgba(16, 19, 34, .46);
    --edge: rgba(255, 255, 255, .16);
    --cyan: #7fd8ff;
    --violet: #b39bff;
    --muted: rgba(206, 218, 245, .58);
    --text-rgb: 247, 225, 215;
    --glow-rgb: 255, 255, 255;
    --glow-strength: .3;
    --glow-radius: .5;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #070912; color: #f2f6ff; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 45% at 22% 18%, rgba(76, 52, 150, .42), transparent 70%),
      radial-gradient(ellipse 50% 40% at 82% 26%, rgba(20, 96, 140, .38), transparent 72%),
      radial-gradient(ellipse 90% 60% at 50% 108%, rgba(12, 30, 62, .9), transparent 70%),
      linear-gradient(165deg, #0d1024 0%, #0a1020 45%, #05070f 100%);
  }
  .glowA, .glowB { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
  .glowA { width: 460px; height: 460px; left: 12%; top: 8%; background: #4a3aa8; }
  .glowB { width: 380px; height: 380px; right: 10%; top: 30%; background: #1d6d9c; }
  .horizon {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: linear-gradient(180deg, transparent, rgba(4, 6, 14, .92));
    border-top: 1px solid rgba(140, 180, 255, .07);
  }
  .grid {
    position: absolute; left: -20%; right: -20%; bottom: -8%; height: 42%;
    background-image:
      linear-gradient(rgba(120, 170, 255, .075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 255, .075) 1px, transparent 1px);
    background-size: 68px 68px;
    transform: perspective(500px) rotateX(64deg);
    transform-origin: bottom center; opacity: .55;
  }
  .crosshair { position: absolute; left: 50%; top: 46%; width: 18px; height: 18px; transform: translate(-50%, -50%); opacity: .45; }
  .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(230, 240, 255, .9); }
  .crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  .crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 240px 90px rgba(0,0,0,.6); pointer-events: none; }

  .tag { position: absolute; left: 34px; top: 28px; display: flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: .06em; color: rgba(220,232,255,.66); }
  .tag b { color: #fff; font-weight: 550; letter-spacing: .02em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6ee7b7; box-shadow: 0 0 12px #6ee7b7; }

  .island {
    position: absolute; top: 22px; right: 34px; display: flex; align-items: center; gap: 14px;
    height: 62px; padding: 8px 20px 8px 9px; border-radius: 999px;
    background: rgba(8, 10, 20, .72); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 14px 40px rgba(0,0,0,.45);
    min-width: 320px;
  }
  .art {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: conic-gradient(from 210deg, #6f5bff, #40b6e0, #f27bb5, #6f5bff);
    box-shadow: 0 0 22px rgba(120,150,255,.45), inset 0 0 0 5px rgba(8,10,20,.55);
    animation: spin 12s linear infinite;
  }
  .island.paused .art { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { flex: 1; min-width: 0; }
  .title { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .wave { display: flex; align-items: center; gap: 3px; height: 22px; }
  .wave i { width: 3px; border-radius: 2px; height: 6px; display: block;
    background: linear-gradient(180deg, var(--cyan), var(--violet));
    animation: bounce 1.1s ease-in-out infinite alternate; }
  .wave i:nth-child(2){ animation-delay: .15s } .wave i:nth-child(3){ animation-delay: .3s }
  .wave i:nth-child(4){ animation-delay: .45s } .wave i:nth-child(5){ animation-delay: .6s }
  @keyframes bounce { from { height: 5px; opacity: .55 } to { height: 20px; opacity: 1 } }
  .island.paused .wave i { animation-play-state: paused; height: 5px; }

  .safe {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 30vw; height: 44vh; border: 1px dashed rgba(160, 200, 255, .2);
    border-radius: 20px; background: rgba(120, 180, 255, .025);
    display: grid; place-items: center; text-align: center;
    font-size: 11px; line-height: 1.9; letter-spacing: .08em;
    color: rgba(190, 215, 255, .42); pointer-events: none;
  }
  body.hide-guides .safe { display: none; }

  .side { position: absolute; top: 50%; transform: translateY(-50%);
    width: min(28vw, 440px); pointer-events: none; }
  .side.left { left: 3.5vw; text-align: left; }
  .side.right { right: 3.5vw; text-align: right; }
  .side-label { font-size: 10px; letter-spacing: .22em; color: rgba(160, 195, 245, .55);
    margin-bottom: 16px; text-transform: uppercase; }
  .faded { font-size: clamp(15px, 1.35vw, 20px); line-height: 1.75;
    color: rgba(226, 238, 255, .38); letter-spacing: .04em;
    transition: opacity .3s linear; }
  .faded.above { margin-bottom: 12px; }
  .faded.below { margin-top: 14px; }
  .tr-line { margin-top: 14px; font-size: clamp(13px, 1.15vw, 17px); line-height: 1.7;
    color: rgba(206, 226, 255, .9); transition: opacity .15s linear; }
  .tr-label { font-size: 10px; letter-spacing: .18em; color: rgba(160,195,245,.5);
    margin-top: 22px; margin-bottom: 10px; }
  .clock { margin-top: 18px; font-size: 12px; color: rgba(190,210,245,.6); font-variant-numeric: tabular-nums; }

  /* ---- 逐字 Glyph：对照 jar 的 LyricsModule.drawGlyph / drawAnimated ---- */
  .main-line {
    position: relative; font-size: clamp(22px, 2.15vw, 34px); font-weight: 600;
    letter-spacing: .05em; line-height: 1.5; word-break: break-all;
    transform: scale(var(--slam, 1)) rotate(var(--tilt, 0deg));
    transform-origin: left center;
  }
  .side.right .main-line { transform-origin: right center; }
  .glyph-layer { position: relative; z-index: 2; }
  .glow-layer {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    filter: blur(calc(3px + var(--glow-radius) * 16px));
    opacity: calc(.18 + var(--glow-strength) * .9);
    mix-blend-mode: screen;
  }
  .glyph {
    position: relative; display: inline-block;
    color: rgb(var(--text-rgb));
    -webkit-text-stroke: .5px rgba(0, 0, 0, .45);
    transform: translate(var(--wx, 0px), var(--wy, 0px)) scale(var(--pop, 1));
    transform-origin: center 70%;
    transition: transform .12s linear;
  }
  .glyph::after {
    content: attr(data-c); position: absolute; left: 0; top: 0;
    color: #fff; -webkit-text-stroke: 0; white-space: pre; pointer-events: none;
    text-shadow: 0 0 3px #fff,
                 0 0 12px rgba(var(--glow-rgb), .95),
                 0 0 30px rgba(var(--glow-rgb), .6);
    clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0);
  }
  .glow-layer .glyph { color: transparent; -webkit-text-stroke: 0; }
  .glow-layer .glyph::after { color: rgb(var(--glow-rgb)); text-shadow: none; }
  body.no-glow .glow-layer { display: none; }
  body.no-stroke .glyph { -webkit-text-stroke: 0; }

  body[data-layout="center"] .side.left {
    left: 50%; right: auto; width: min(76vw, 900px);
    transform: translate(-50%, -50%); text-align: center;
  }
  body[data-layout="center"] .side.right, body[data-layout="center"] .safe { display: none; }
  body[data-layout="left"] .side.right, body[data-layout="left"] .safe { display: none; }
  body[data-layout="right"] .side.left, body[data-layout="right"] .safe { display: none; }

  /* ---- 液态玻璃：对照 glass.frag 的圆角 SDF / 边缘高光 / 色散 ---- */
  .glass {
    position: relative;
    background: var(--glass); border: 1px solid var(--edge);
    backdrop-filter: blur(28px) saturate(165%); -webkit-backdrop-filter: blur(28px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(255,255,255,.05),
                0 20px 55px rgba(0,0,0,.5);
  }
  .glass::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,0) 38%,
                rgba(140,180,255,0) 70%, rgba(180,140,255,.06));
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.16), inset -1px -1px 0 rgba(120,160,255,.08);
  }
  .card { position: absolute; left: 40px; bottom: 40px; width: 306px; padding: 18px; border-radius: 22px; overflow: hidden; }
  .card::before {
    content: ''; position: absolute; width: 220px; height: 220px; right: -90px; top: -110px;
    border-radius: 50%; background: radial-gradient(circle, rgba(126, 160, 255, .28), transparent 70%); pointer-events: none;
  }
  .card-head { display: flex; gap: 14px; align-items: center; position: relative; }
  .cover { width: 62px; height: 62px; border-radius: 14px; flex: none;
    background: conic-gradient(from 210deg, #6f5bff, #40b6e0, #f27bb5, #6f5bff);
    box-shadow: 0 8px 24px rgba(90, 110, 220, .38); }
  .card h2 { font-size: 15px; font-weight: 550; }
  .card p { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.13); margin: 18px 0 8px; overflow: hidden; cursor: pointer; }
  .bar > i { display: block; height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, #ffb0a6, #a7c3ff); box-shadow: 0 0 12px rgba(167,195,255,.7); }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 14px; }
  .controls button { border: 0; background: transparent; color: rgba(235,245,255,.85); cursor: pointer;
    font-size: 15px; padding: 6px; line-height: 1; transition: color .2s, transform .2s; }
  .controls button:hover { color: #fff; transform: scale(1.14); }
  .controls .play { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.2); color: #fff; }

  .dock { position: absolute; right: 40px; bottom: 40px; display: flex; flex-direction: column; gap: 9px; align-items: flex-end; }
  .dock button { padding: 10px 15px; border-radius: 12px; font-size: 11.5px; color: rgba(235,243,255,.88);
    cursor: pointer; font-family: inherit; transition: transform .18s, background .18s; }
  .dock button:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); }
  .hint { max-width: 300px; font-size: 11px; line-height: 1.75; color: rgba(190,206,238,.6); text-align: right; padding: 10px 14px; border-radius: 12px; }

  .panel {
    position: absolute; left: 50%; bottom: 34px; transform: translate(-50%, 130%);
    width: min(680px, 88vw); height: 500px; border-radius: 26px; padding: 20px 22px;
    transition: transform .42s cubic-bezier(.22, 1, .36, 1); z-index: 5;
  }
  .panel.open { transform: translate(-50%, 0); }
  .panel-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .panel-top h3 { font-size: 14px; font-weight: 550; flex: 1; }
  .search { flex: 1; max-width: 300px; padding: 9px 14px; border-radius: 11px; font-size: 12px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.13);
    color: #fff; outline: none; font-family: inherit; }
  .search::placeholder { color: rgba(200,215,245,.4); }
  .close { border: 0; background: rgba(255,255,255,.09); color: #fff; width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  .tracks { display: grid; gap: 6px; max-height: 156px; overflow-y: auto; }
  .track { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 12px;
    background: rgba(255,255,255,.045); font-size: 12px; transition: background .2s; cursor: pointer; }
  .track:hover { background: rgba(255,255,255,.12); }
  .track .idx { width: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .track .thumb { width: 32px; height: 32px; border-radius: 8px; flex: none; }
  .track .name { flex: 1; }
  .track .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
  .track.active { background: rgba(127, 216, 255, .13); border: 1px solid rgba(127,216,255,.24); }
  .empty-tip { padding: 18px; text-align: center; font-size: 12px; color: var(--muted); }
  .fx { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.09); }
  .fx-title { font-size: 11px; letter-spacing: .1em; color: rgba(180,205,245,.7); margin-bottom: 10px; }
  .fx-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .fx-row button { padding: 7px 11px; border-radius: 9px; font-size: 11px; color: rgba(235,243,255,.85);
    cursor: pointer; font-family: inherit; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.11); }
  .fx-row button:hover { background: rgba(255,255,255,.13); }
  .fx-row button.on { background: rgba(127,216,255,.16); border-color: rgba(127,216,255,.38); }
  .fx-slider { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 7px; }
  .fx-slider input { flex: 1; accent-color: #7fd8ff; }
  .fx-slider span { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

  body.eco .glass, body.eco .island { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(12,15,26,.9); }
  body.eco .glowA, body.eco .glowB, body.eco .glow-layer { display: none; }
  body.eco .glyph::after { text-shadow: 0 0 2px #fff; }
</style>
</head>
<body data-layout="split">
<div class="scene">
  <div class="sky"></div><div class="glowA"></div><div class="glowB"></div>
  <div class="horizon"></div><div class="grid"></div>
  <div class="crosshair"></div><div class="vignette"></div>
</div>

<div class="tag"><span class="dot"></span><b>GlassLyrics</b> · v0.3 · 参照 DangoMusic 歌词渲染</div>

<div class="island" id="island">
  <div class="art" id="islandArt"></div>
  <div class="meta">
    <div class="title" id="islandTitle">—</div>
    <div class="artist" id="islandArtist">—</div>
  </div>
  <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
</div>

<div class="safe">中央视野保留区<br>不显示任何歌词 · 准星区域完全留空</div>

<div class="side left">
  <div class="side-label">原文 · 逐字 Glyph</div>
  <div class="faded above" id="prevLine">—</div>
  <div class="main-line" id="curLine">
    <div class="glow-layer" id="curGlow" aria-hidden="true"></div>
    <div class="glyph-layer" id="curGlyphs"></div>
  </div>
  <div class="faded below" id="nextLine">—</div>
</div>

<div class="side right">
  <div class="side-label">翻译 / 预告</div>
  <div class="tr-line" id="trLine">—</div>
  <div class="tr-label">下一句</div>
  <div class="faded" id="rightNext">—</div>
  <div class="clock" id="clock">0:00 / 0:16</div>
</div>

<div class="card glass">
  <div class="card-head">
    <div class="cover" id="cover"></div>
    <div><h2 id="cardTitle">—</h2><p id="cardArtist">—</p></div>
  </div>
  <div class="bar" id="seekBar"><i id="bar"></i></div>
  <div class="times"><span id="cur">0:00</span><span id="total">0:16</span></div>
  <div class="controls">
    <button id="prevBtn" title="上一首 (←)">⏮</button>
    <button class="play" id="playBtn" title="播放 / 暂停 (空格)">❚❚</button>
    <button id="nextBtn" title="下一首 (→)">⏭</button>
  </div>
</div>

<div class="dock">
  <button class="glass" id="panelBtn">播放器 / 歌词参数（P）</button>
  <button class="glass" id="layoutBtn">布局：双侧不挡视野</button>
  <button class="glass" id="guidesBtn">隐藏中央标线</button>
  <button class="glass" id="ecoBtn">切换省电模式</button>
  <div class="hint glass">
    逐字渲染参照 DangoMusic 的 LyricsModule：Glyph 独立绘制、charTimes 非均匀时间轴、wordPop、8fps wiggle、DeepGlow 多级辉光。<br>
    演示文本为原创占位句，不含真实歌词数据。
  </div>
</div>

<div class="panel glass" id="panel">
  <div class="panel-top">
    <h3>播放器</h3>
    <input class="search" id="search" placeholder="过滤演示曲目">
    <button class="close" id="closeBtn">✕</button>
  </div>
  <div class="tracks" id="tracks"></div>
  <div class="fx">
    <div class="fx-title">歌词效果 · 对照 jar 默认值</div>
    <div class="fx-row">
      <button id="tintBtn" class="on">辉光：白</button>
      <button id="popBtn" class="on">逐字弹跳：开</button>
      <button id="wiggleBtn" class="on">字摆动 8fps：开</button>
      <button id="flashBtn">整句砸入：关</button>
      <button id="strokeBtn" class="on">黑色描边：开</button>
    </div>
    <label class="fx-slider">辉光强度 <input type="range" id="glowStrength" min="0" max="3" step="0.05" value="0.3"><span id="gsVal">0.30</span></label>
    <label class="fx-slider">辉光半径 <input type="range" id="glowRadius" min="0" max="1" step="0.05" value="0.5"><span id="grVal">0.50</span></label>
  </div>
</div>

<script>
const G1 = 'conic-gradient(from 210deg, #6f5bff, #40b6e0, #f27bb5, #6f5bff)';
const G2 = 'conic-gradient(from 40deg, #ff8fb1, #ffc46b, #7be0c0, #ff8fb1)';
const G3 = 'conic-gradient(from 130deg, #3aa0ff, #8a7bff, #54e0d0, #3aa0ff)';
const G4 = 'conic-gradient(from 300deg, #f07a5a, #f0c05a, #a06bff, #f07a5a)';
const L = (text, tr) => ({ text, tr });
const TRACKS = [
  { title: '夜色落在窗台边缘', artist: '演示曲目 A · GlassLyrics Preview', cover: G1,
    lines: [
      L('夜色落在窗台边缘', 'Night falls on the edge of the sill'),
      L('屏幕微光 映着侧脸', 'A faint glow outlines your face'),
      L('我们把时间轻轻折叠', 'We fold the hours softly away'),
      L('藏进这一帧画面', 'And keep them inside this frame')
    ] },
  { title: '折叠的时间', artist: '演示曲目 B · GlassLyrics Preview', cover: G2,
    lines: [
      L('风穿过未关的窗', 'Wind slips through the open window'),
      L('把黄昏吹成浅色', 'And turns the dusk into pale light'),
      L('你数着远处的灯', 'You count the distant lanterns'),
      L('像数着慢慢的心跳', 'Like counting a slowing heartbeat')
    ] },
  { title: '屏幕微光', artist: '演示曲目 C · GlassLyrics Preview', cover: G3,
    lines: [
      L('一格一格的光', 'Light, one frame at a time'),
      L('落在安静的键盘上', 'Rests on a quiet keyboard'),
      L('世界暂时调成静音', 'The world is muted for a while'),
      L('只剩这一行在亮', 'Only this line still glows')
    ] },
  { title: '这一帧画面', artist: '演示曲目 D · GlassLyrics Preview', cover: G4,
    lines: [
      L('暂停在转身之前', 'Paused just before the turn'),
      L('留一半话没有讲', 'Half the words left unsaid'),
      L('等下一次加载完成', 'Waiting for the next load to finish'),
      L('再一起走进画面', 'Then we step into the frame again')
    ] }
];
const STEP = 4;
const TINTS = [
  { name: '白',   rgb: '255, 255, 255' },
  { name: '粉',   rgb: '255, 97, 158' },
  { name: '蓝',   rgb: '82, 168, 255' },
  { name: '琥珀', rgb: '255, 189, 77' }
];
const LAYOUTS = [
  { key: 'split',  label: '双侧不挡视野' },
  { key: 'center', label: '居中（旧版）' },
  { key: 'left',   label: '仅左侧' },
  { key: 'right',  label: '仅右侧' }
];

let trackIdx = 0, elapsed = 0, playing = true, last = performance.now(), lastKey = -1, layoutIdx = 0, tintIdx = 0;
let wordPop = true, wiggle = true, textFlash = false, stroke = true;
let charStarts = [], charEnds = [], popAt = [], lineAt = 0, lastWiggleTick = -1;
const $ = id => document.getElementById(id);
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const track = () => TRACKS[trackIdx];
const duration = () => track().lines.length * STEP;

/* charTimes：按字生成非均匀时长，模拟 YRC 逐字时间戳 */
function buildCharTimes(text) {
  const n = text.length;
  const w = [];
  for (let i = 0; i < n; i++) {
    const c = text[i];
    w.push((c === ' ' ? 0.35 : 0.65) + (Math.sin(i * 2.31 + 0.7) + 1) * 0.38);
  }
  const sum = w.reduce((a, b) => a + b, 0);
  const starts = [], ends = [];
  let acc = 0;
  for (const x of w) { starts.push(acc / sum); acc += x; ends.push(acc / sum); }
  return { starts, ends };
}

function renderGlyphs(text) {
  const a = $('curGlyphs'), b = $('curGlow');
  a.innerHTML = ''; b.innerHTML = '';
  for (const c of text) {
    const ch = c === ' ' ? '\u00a0' : c;
    for (const host of [a, b]) {
      const s = document.createElement('span');
      s.className = 'glyph'; s.dataset.c = ch; s.textContent = ch;
      host.appendChild(s);
    }
  }
  const t = buildCharTimes(text);
  charStarts = t.starts; charEnds = t.ends;
  popAt = new Array(text.length).fill(-1);
  lastWiggleTick = -1;
}

/* jar TextFlash.popScale：160ms 内 0.28 -> 1，带阻尼 */
function popScale(age) {
  const t = clamp(age / 160, 0, 1), k = 1 - t;
  return 1 + 0.28 * k * k + 0.04 * Math.sin(t * Math.PI) * k - k;
}
/* jar hashRand：每个字独立相位的确定性抖动 */
function hashRand(i, tick) {
  let h = Math.imul(i, 73856093) ^ Math.imul(tick, 19349663) ^ 83492791 ^ i;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function renderTrackList(filter = '') {
  const box = $('tracks');
  box.innerHTML = '';
  let shown = 0;
  TRACKS.forEach((t, i) => {
    if (filter && (t.title + t.artist).toLowerCase().indexOf(filter.toLowerCase()) < 0) return;
    shown++;
    const d = document.createElement('div');
    d.className = 'track' + (i === trackIdx ? ' active' : '');
    const idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = String(i + 1).padStart(2, '0');
    const thumb = document.createElement('span'); thumb.className = 'thumb'; thumb.style.background = t.cover;
    const name = document.createElement('span'); name.className = 'name'; name.textContent = t.title;
    const dur = document.createElement('span'); dur.className = 'dur'; dur.textContent = fmt(t.lines.length * STEP);
    d.append(idx, thumb, name, dur);
    d.onclick = () => switchTrack(i);
    box.appendChild(d);
  });
  if (!shown) {
    const tip = document.createElement('div');
    tip.className = 'empty-tip'; tip.textContent = '没有匹配的演示曲目';
    box.appendChild(tip);
  }
}

function renderTrackInfo() {
  const t = track();
  $('islandTitle').textContent = t.title;
  $('islandArtist').textContent = t.artist;
  $('cardTitle').textContent = t.title;
  $('cardArtist').textContent = t.artist;
  $('cover').style.background = t.cover;
  $('islandArt').style.background = t.cover;
  $('total').textContent = fmt(duration());
  renderTrackList($('search').value);
}

function switchTrack(i) {
  trackIdx = (i + TRACKS.length) % TRACKS.length;
  elapsed = 0; lastKey = -1;
  renderTrackInfo(); setPlaying(true);
}

function setPlaying(v) {
  playing = v;
  $('playBtn').textContent = v ? '❚❚' : '▶';
  $('island').className = 'island' + (v ? '' : ' paused');
}

function renderLyrics(idx) {
  const lines = track().lines, cur = lines[idx];
  $('prevLine').textContent = idx > 0 ? lines[idx - 1].text : '\u00a0';
  $('nextLine').textContent = lines[Math.min(lines.length - 1, idx + 1)].text;
  $('rightNext').textContent = lines[Math.min(lines.length - 1, idx + 1)].text;
  $('trLine').textContent = cur.tr;
  renderGlyphs(cur.text);
  lineAt = performance.now();
  $('curLine').classList.remove('enter');
  void $('curLine').offsetWidth;
  $('curLine').classList.add('enter');
}

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing) elapsed += dt;
  if (elapsed >= duration()) switchTrack(trackIdx + 1);

  const lines = track().lines;
  const idx = Math.min(lines.length - 1, Math.floor(elapsed / STEP));
  const local = clamp((elapsed - idx * STEP) / STEP, 0, 1);
  const key = trackIdx * 1000 + idx;
  if (key !== lastKey) { renderLyrics(idx); lastKey = key; }

  const g1 = $('curGlyphs').children, g2 = $('curGlow').children;
  const wigTick = Math.floor(now / 125);
  const doWiggle = wiggle && wigTick !== lastWiggleTick;
  if (doWiggle) lastWiggleTick = wigTick;

  for (let i = 0; i < g1.length; i++) {
    const s = charStarts[i] ?? 0, e = charEnds[i] ?? 1;
    const p = clamp((local - s) / Math.max(0.0001, e - s), 0, 1);
    const pp = (p * 100).toFixed(1) + '%';
    g1[i].style.setProperty('--p', pp);
    if (g2[i]) g2[i].style.setProperty('--p', pp);

    if (wordPop) {
      if (p > 0 && popAt[i] < 0) popAt[i] = now;
      const age = popAt[i] < 0 ? 9999 : now - popAt[i];
      const bump = age >= 9999 ? 1 : 1 + 0.16 * Math.exp(-age / 90) * (1 - clamp(age / 220, 0, 1));
      g1[i].style.setProperty('--pop', bump.toFixed(3));
    } else {
      g1[i].style.setProperty('--pop', '1');
    }
    if (doWiggle) {
      g1[i].style.setProperty('--wx', ((hashRand(i, wigTick) - .5) * 1.6).toFixed(2) + 'px');
      g1[i].style.setProperty('--wy', ((hashRand(i + 977, wigTick) - .5) * 1.6).toFixed(2) + 'px');
    }
  }

  /* textFlash：整句按 popScale 砸入，160ms */
  const slam = textFlash ? popScale(now - lineAt) : 1;
  $('curLine').style.setProperty('--slam', slam.toFixed(3));
  $('curLine').style.setProperty('--tilt', textFlash ? (1 - slam) * 3 + 'deg' : '0deg');
  $('trLine').style.opacity = (0.55 + local * 0.45).toFixed(2);
  $('prevLine').style.opacity = (0.3 + clamp(now - lineAt, 0, 300) / 300 * 0.08).toFixed(2);
  $('bar').style.width = (elapsed / duration() * 100).toFixed(2) + '%';
  $('cur').textContent = fmt(elapsed);
  $('clock').textContent = fmt(elapsed) + ' / ' + fmt(duration());
  requestAnimationFrame(tick);
}

function toggleBtn(id, on) { $(id).classList.toggle('on', on); }
function setTint(i) {
  tintIdx = (i + TINTS.length) % TINTS.length;
  document.documentElement.style.setProperty('--glow-rgb', TINTS[tintIdx].rgb);
  $('tintBtn').textContent = '辉光：' + TINTS[tintIdx].name;
}

$('playBtn').onclick = () => setPlaying(!playing);
$('prevBtn').onclick = () => { if (elapsed > 2) { elapsed = 0; lastKey = -1; } else switchTrack(trackIdx - 1); };
$('nextBtn').onclick = () => switchTrack(trackIdx + 1);
$('seekBar').onclick = e => {
  const r = $('seekBar').getBoundingClientRect();
  elapsed = clamp((e.clientX - r.left) / r.width * duration(), 0, duration() - .01);
  lastKey = -1;
};
$('panelBtn').onclick = () => $('panel').classList.toggle('open');
$('closeBtn').onclick = () => $('panel').classList.remove('open');
$('search').oninput = e => renderTrackList(e.target.value);
$('layoutBtn').onclick = () => {
  layoutIdx = (layoutIdx + 1) % LAYOUTS.length;
  document.body.dataset.layout = LAYOUTS[layoutIdx].key;
  $('layoutBtn').textContent = '布局：' + LAYOUTS[layoutIdx].label;
};
$('guidesBtn').onclick = () => {
  document.body.classList.toggle('hide-guides');
  $('guidesBtn').textContent = document.body.classList.contains('hide-guides') ? '显示中央标线' : '隐藏中央标线';
};
$('ecoBtn').onclick = () => document.body.classList.toggle('eco');
$('tintBtn').onclick = () => setTint(tintIdx + 1);
$('popBtn').onclick = () => { wordPop = !wordPop; $('popBtn').textContent = '逐字弹跳：' + (wordPop ? '开' : '关'); toggleBtn('popBtn', wordPop); };
$('wiggleBtn').onclick = () => { wiggle = !wiggle; $('wiggleBtn').textContent = '字摆动 8fps：' + (wiggle ? '开' : '关'); toggleBtn('wiggleBtn', wiggle); };
$('flashBtn').onclick = () => { textFlash = !textFlash; $('flashBtn').textContent = '整句砸入：' + (textFlash ? '开' : '关'); toggleBtn('flashBtn', textFlash); };
$('strokeBtn').onclick = () => { stroke = !stroke; document.body.classList.toggle('no-stroke', !stroke); $('strokeBtn').textContent = '黑色描边：' + (stroke ? '开' : '关'); toggleBtn('strokeBtn', stroke); };
$('glowStrength').oninput = e => {
  document.documentElement.style.setProperty('--glow-strength', e.target.value);
  $('gsVal').textContent = Number(e.target.value).toFixed(2);
};
$('glowRadius').oninput = e => {
  document.documentElement.style.setProperty('--glow-radius', e.target.value);
  $('grVal').textContent = Number(e.target.value).toFixed(2);
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if (k === 'p') $('panel').classList.toggle('open');
  if (k === 'l') $('layoutBtn').click();
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowLeft') $('prevBtn').click();
  if (e.key === 'ArrowRight') $('nextBtn').click();
});

renderTrackInfo();
setTint(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
