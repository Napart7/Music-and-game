<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .icon {
    position: absolute; inset: 64px; border-radius: 232px;
    background:
      radial-gradient(620px 480px at 22% 8%, rgba(120,175,255,.85), rgba(120,175,255,0) 62%),
      radial-gradient(560px 460px at 88% 96%, rgba(255,120,190,.65), rgba(255,120,190,0) 60%),
      linear-gradient(155deg, #131b30 0%, #0b1120 52%, #151024 100%);
    border: 3px solid rgba(255,255,255,.22);
    box-shadow:
      inset 0 4px 0 rgba(255,255,255,.32),
      inset 0 -18px 60px rgba(0,0,0,.45),
      0 40px 90px rgba(30,60,140,.45);
    display: grid; place-items: center;
  }
  .glyph {
    font-family: "Segoe UI Symbol", "Apple Symbols", system-ui, sans-serif;
    font-size: 420px; line-height: 1; color: #fff;
    text-shadow: 0 0 40px rgba(150,195,255,.95), 0 0 110px rgba(255,130,200,.55);
    transform: translateY(-8px);
  }
  .ring { position: absolute; inset: 120px; border-radius: 176px;
    border: 2px solid rgba(160,200,255,.18); }
</style>
</head>
<body>
  <div class="icon"><div class="ring"></div><div class="glyph">◈</div></div>
</body>
</html>
