name: build-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compliance check (layout, secrets, GPL sources)
        shell: pwsh
        run: |
          $required = @(
            'README.md','LICENSE','docs/技术方案.md','docs/使用说明.md','docs/第三方声明.md',
            'src/preview.html','app/main.js','app/preload.js','app/lyrics.js','app/providers.js',
            'app/smtc-bridge.ps1','app/smtc-control.ps1','app/window-probe.ps1','app/renderer/index.html',
            'tools/verify_providers.mjs'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing required file: $f" }
          }
          $blocked = Get-ChildItem -Recurse -File -Include *.env,*.key,*.pem,netease_cookie.txt,qqmusic_cookie.txt -ErrorAction SilentlyContinue
          if ($blocked) { throw "Sensitive file found in repo" }
          $hits = Select-String -Path (Get-ChildItem -Recurse -File -Include *.js,*.ts,*.py,*.ps1 -ErrorAction SilentlyContinue).FullName -Pattern 'me/sorihiko/dango|LDDC/core' -ErrorAction SilentlyContinue
          if ($hits) { throw "GPL source reference detected" }
          Write-Host "Compliance check OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        shell: pwsh
        run: |
          node --check app/main.js
          node --check app/preload.js
          node --check app/lyrics.js
          node --check app/providers.js
          node tools/verify_providers.mjs
          node -e "const fs=require('fs');const s=fs.readFileSync('app/renderer/index.html','utf8');new Function(s.match(/<script>([\s\S]*?)<\/script>/)[1]);console.log('renderer JS OK')"
          $errs = $null
          foreach ($f in @('app/smtc-bridge.ps1','app/smtc-control.ps1','app/window-probe.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) { throw "PowerShell syntax error in $f" }
          }
          Write-Host "Syntax check OK"

      - name: Build installer and portable exe
        working-directory: app
        run: npm run dist

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name,Length | Format-Table -AutoSize

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
